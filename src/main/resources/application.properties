# ===== HTTP =====
server.port=8080

# ===== 行情处理参数 =====
# 入站有界队列容量；满后以 BACKPRESSURE 显式拒绝（429），不会无界堆积或静默丢弃
market-data.queue-capacity=2048
# 乱序容忍窗口（毫秒）：事件时间落后最新值不超过该值的消息按事件时间归位接受
market-data.disorder-tolerance-millis=5000
# 时钟回拨阈值（毫秒）：落后最新值超过该值判为 CLOCK_ROLLBACK，与一般过期区分
market-data.clock-rollback-threshold-millis=60000
# 数据新鲜度容忍（毫秒）：快照最新事件时间早于墙钟超过该值则 stale=true
market-data.freshness-tolerance-millis=3000
# 聚合窗口长度（毫秒）：以最大事件时间为右端点的尾随窗口
market-data.window-length-millis=60000
# 每品种去重缓存（LRU）容量
market-data.dedup-cache-capacity=100000

# ===== 本地持久化（重启恢复） =====
market-data.persistence.enabled=true
market-data.data-dir=./data
market-data.log-file-prefix=quotes
market-data.log-max-file-bytes=67108864
# 每条记录是否 fsync（本地验证用默认 false 换取吞吐；崩溃可能丢失最后若干条已接受记录）
market-data.log-fsync=false

# ===== 进程内模拟行情源 =====
market-data.simulated-feed-enabled=true
market-data.simulated-feed-interval-millis=200

# ===== 日志：输入与判定依据以 INFO 输出，便于核对 =====
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
logging.level.com.github.xingjianluo=INFO
