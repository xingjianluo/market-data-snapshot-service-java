# HTTP 端口；本地验证用 8080，可用 -Dserver.port=0 随机端口
server.port=8080
spring.application.name=market-data-snapshot-service

# ===== 行情服务配置（全部带默认值，可通过 -D 或环境变量覆盖）=====
# 写入队列容量与入队超时：满则在超时后以 BACKPRESSURE 显式拒绝（有界、不静默丢弃）
market.service.queue-capacity=4096
market.service.enqueue-timeout-millis=50

# 时序判定
# 乱序容忍窗口：eventTime 落后最新值在该范围内 -> OUT_OF_ORDER 归位计入
market.service.out-of-order-lag-millis=5000
# 数据有效期：超过乱序窗口但仍在 TTL 边界内 -> EXPIRED（业务过期）
market.service.data-ttl-millis=60000
# 时钟回拨/漂移阈值：相对服务端接收时间超出该范围 -> CLOCK_ROLLBACK（与过期区分）
market.service.cl-rollback-age-millis=86400000

# 窗口聚合
market.service.window-size-millis=1000
market.service.retained-windows=60
# 数据超过该年龄未更新，查询结果标记 stale=true（数据不可信）
market.service.stale-threshold-millis=5000

# 去重（每品种保留最近事件数，按 eventTime 淘汰；同时持久化到检查点）
market.service.dedup-retained-per-symbol=4096

# 本地持久化状态目录（WAL + checkpoint.json）
market.service.state-dir=market-data-state
market.service.checkpoint-interval-messages=1000
market.service.checkpoint-interval-millis=2000
market.service.recovery-enabled=true

# 内置进程内模拟行情源（默认关闭；本地演示时设为 true）
market.service.feed-enabled=false
market.service.feed-interval-millis=20
market.service.feed-symbols=BTCUSDT,ETHUSDT

# 单条处理延迟（毫秒，默认 0）；调大可确定性复现背压，仅演示/压测使用
market.service.process-delay-millis=0

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
